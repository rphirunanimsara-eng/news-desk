<!DOCTYPE html>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

        <h2 class="title">Announcements</h2>
        <div class="box"><ul id="announcements"></ul></div>

    </div>

  <div id="site-footer"></div>
